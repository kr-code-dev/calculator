<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First Calculator</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>
  <body>
    <div class="calculator">
      <h1>Simple Calculator</h1>

      <form>
        <div class="field">
          <label for="firstNumber">First Number:</label>
          <input
            type="number"
            id="firstNumber"
            placeholder="Enter first number"
          />
        </div>

        <div class="field">
          <label for="secondNumber">Second Number:</label>
          <input
            type="number"
            id="secondNumber"
            placeholder="Enter second number"
          />
        </div>

        <div class="buttons">
          <button type="button" id="add">✚</button>
          <button type="button" id="subtract">−</button>
          <button type="button" id="multiply">＊</button>
          <button type="button" id="divide">÷</button>
          <button type="button" id="clear" class="clear">C</button>
        </div>

        <p><b>Result:</b> <span id="result">0</span></p>
      </form>
    </div>

    <script src="calculator.js"></script>
  </body>
</html>
